<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN - Line Wave</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script>
var time = 0;
var f = 2;
var tf = 0.003;
var col;
var c;
var spacing = 20;
var range;

function setup() {
  createCanvas(window.screen.width, window.screen.height);
  colorMode(HSB, 100);
  frameRate(60);
  range = random(0, 90);
  col = color(100, 0, 0, 10);
  background(col);
  c = color(100, 0, 100);
  updateAnimation();
}

function draw() {
  fill(col);
  noStroke();
  rect(0, 0, width, height);

  stroke(c);
  var x = 0;
  while (x < width) {
    point(x, 50 + (height - 50) * noise(x / 700, time * 2));
    x = x + f;
  }
  time = time + tf;
  if (frameCount >= 240) {
    if (frameCount % 240 == 0) {
      updateAnimation();
    }
  }
}

function mousePressed() {
  updateAnimation();
}

function updateAnimation() {
  f = random(1, 5);
  range = random(0, 90);
  col = color(range, 80, 15, 10);
  c = color(map(noise(time), 0, 1, range, range + 10), 80, 90);
  tf = random(0.005, 0.001);
}
</script>
</body>
</html>
